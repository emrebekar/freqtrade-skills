name: release-watch

# Weekly: when Freqtrade ships a new stable release, test the skills against it and open an
# issue with the result plus the doc sections that changed (mapped to the reference files that
# cite them). The content rewrite itself stays a reviewed PR; nothing is committed here.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect new release
        id: detect
        run: |
          set -euo pipefail
          latest="$(gh release view -R freqtrade/freqtrade --json tagName -q .tagName)"
          # The tag is external input: accept only a plain version before it reaches docker or git.
          [[ "$latest" =~ ^[0-9]{4}\.[0-9]+(\.[0-9]+)?$ ]] || { echo "unexpected tag: $latest" >&2; exit 1; }
          current="$(python3 -c 'import json; print(json.load(open("freqtrade-version.json"))["tag"])')"
          title="Freqtrade $latest released: refresh skills"
          echo "latest=$latest current=$current"
          if [ "$latest" = "$current" ]; then
            echo "Already on $current, nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Capture first: a pipe into grep -q can SIGPIPE gh under pipefail and look like "no match".
          titles="$(gh issue list --state open --limit 200 --json title -q '.[].title')"
          if grep -Fxq -- "$title" <<<"$titles"; then
            echo "Open issue \"$title\" exists, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "proceed=true"
            echo "latest=$latest"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"

      - name: Test skills against the new image
        if: steps.detect.outputs.proceed == 'true'
        continue-on-error: true
        env:
          NEW_TAG: ${{ steps.detect.outputs.latest }}
        run: |
          set -uo pipefail
          export FT_IMAGE="freqtradeorg/freqtrade:$NEW_TAG"   # scripts/dpy.sh
          export FT_TAG="$NEW_TAG"                             # tests/run_all.sh
          : > test-summary.md
          fail=0
          check() {  # check <label> <cmd...>: run, log, record pass/fail
            local label="$1"; shift
            local log="log-$RANDOM-$$.txt"
            if "$@" > "$log" 2>&1; then
              echo "- PASS: $label" >> test-summary.md
            else
              echo "- FAIL: $label" >> test-summary.md
              fail=1
              { echo; echo "<details><summary>$label log (tail)</summary>"; echo; echo '```'; tail -n 40 "$log"; echo '```'; echo; echo "</details>"; echo; } >> test-summary.md
            fi
          }
          docker pull "$FT_IMAGE" || { echo "- FAIL: docker pull $FT_IMAGE" >> test-summary.md; exit 1; }
          docker pull "${FT_IMAGE}_freqai" || echo "- WARN: docker pull ${FT_IMAGE}_freqai failed" >> test-summary.md
          check "validate_skills" scripts/dpy.sh scripts/validate_skills.py
          check "check_cli" scripts/dpy.sh scripts/check_cli.py
          check "strategies (backtest, lookahead, recursive)" bash tests/run_all.sh
          check "hyperopt" bash tests/run_hyperopt.sh HyperoptExample --image "$FT_IMAGE"
          exit "$fail"

      - name: Diff docs
        if: steps.detect.outputs.proceed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OLD_TAG: ${{ steps.detect.outputs.current }}
          NEW_TAG: ${{ steps.detect.outputs.latest }}
        run: |
          if ! python3 scripts/docs_diff.py --old "$OLD_TAG" --new "$NEW_TAG" --skills skills > docs-diff.md; then
            echo "Docs diff failed, see the workflow run ()." > docs-diff.md
          fi

      - name: Open issue
        if: steps.detect.outputs.proceed == 'true'
        env:
          OLD_TAG: ${{ steps.detect.outputs.current }}
          NEW_TAG: ${{ steps.detect.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          limit=60000   # GitHub issue body maximum is 65536 characters
          {
            echo "Freqtrade \`$NEW_TAG\` is the latest stable release; the skills are pinned to \`$OLD_TAG\`."
            echo
            echo "## Test results against \`$NEW_TAG\`"
            echo
            if [ -s test-summary.md ]; then cat test-summary.md; else echo "Tests did not run (see workflow run)."; fi
            echo
          } > body-head.md
          {
            echo
            echo "Workflow run: $RUN_URL"
            echo
            echo "To refresh: update the affected reference files, bump \`freqtrade-version.json\`, \`tests/strategies.json\` image tags and each SKILL.md footer, then open a reviewed PR."
          } > body-foot.md
          # Only the docs diff is truncated, so the summary and footer always survive.
          budget=$(( limit - $(wc -c < body-head.md) - $(wc -c < body-foot.md) - 200 ))
          if [ "$(wc -c < docs-diff.md)" -gt "$budget" ]; then
            head -c "$budget" docs-diff.md | sed '$d' > diff-cut.md   # drop the partial last line
            opened=$(grep -c '^<details' diff-cut.md || true)
            closed=$(grep -c '^</details>' diff-cut.md || true)
            fences=$(grep -c '^```' diff-cut.md || true)
            [ $(( fences % 2 )) -eq 1 ] && echo '```' >> diff-cut.md
            [ "$opened" -gt "$closed" ] && printf '\n</details>\n' >> diff-cut.md
            printf '\n_Docs diff truncated, see the workflow run for the full report._\n' >> diff-cut.md
          else
            cp docs-diff.md diff-cut.md
          fi
          cat body-head.md diff-cut.md body-foot.md > body.md
          gh issue create --title "Freqtrade $NEW_TAG released: refresh skills" --body-file body.md
